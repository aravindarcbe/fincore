# Continuous deployment: every push to main redeploys the app onto the
# EC2 server provisioned by infra/terraform. Uses OIDC to get short-lived
# AWS credentials (no stored AWS keys) and AWS Systems Manager Run Command
# to execute the deploy script (no SSH key needed either, and no need to
# open port 22 to GitHub's ever-changing runner IPs).
#
# Needs 3 GitHub Actions repo/environment *variables* (Settings -> Secrets
# and variables -> Actions -> Variables tab - not Secrets, none of this is
# sensitive): AWS_REGION, EC2_INSTANCE_ID, DEPLOY_ROLE_ARN. All three are
# printed by `terraform output` after you provision the server - see
# infra/terraform/README.md and the root DEPLOYMENT.md.
name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    # Skips cleanly (instead of failing) until the AWS bootstrap in
    # infra/terraform/README.md is done and DEPLOY_ROLE_ARN is set as a
    # repo variable - so merging infra changes doesn't immediately produce
    # a broken/red "Deploy to production" run on main.
    if: vars.DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy via SSM Run Command
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["/opt/fincore/deploy.sh"]' \
            --comment "GitHub Actions deploy ${GITHUB_SHA::12}" \
            --query "Command.CommandId" --output text)
          echo "SSM command: $COMMAND_ID"

          for i in $(seq 1 30); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "status: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
                --query "StandardOutputContent" --output text
              exit 0
            fi
            case "$STATUS" in
              Failed | Cancelled | TimedOut | Undeliverable)
                echo "--- stdout ---"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
                  --query "StandardOutputContent" --output text || true
                echo "--- stderr ---"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
                  --query "StandardErrorContent" --output text || true
                exit 1
                ;;
            esac
          done
          echo "Timed out waiting for the deploy command to finish"
          exit 1
