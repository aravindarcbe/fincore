# Continuous deployment: every push to main redeploys the app onto the
# EC2 server provisioned by infra/terraform. Requires three repo secrets
# (Settings -> Secrets and variables -> Actions -> New repository secret),
# set up by you - never shared with anyone else:
#
#   EC2_HOST     the server's public IP (terraform output: server_public_ip)
#   EC2_USER     "ubuntu"
#   EC2_SSH_KEY  the PRIVATE half of the key pair you gave Terraform
#                (contents of e.g. ~/.ssh/fincore_ed25519 - not the .pub file)
#
# The workflow only ever uses the private key inside this run's ephemeral
# GitHub-hosted runner; it's discarded when the job ends and never touches
# the repo or a commit.
name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" 'sudo /opt/fincore/deploy.sh'
